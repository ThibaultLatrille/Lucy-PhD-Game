<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucy's PhD Journey 🎓</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <!--
    Lucy's PhD Journey — board game (proof of concept)

    Libraries / frameworks used: NONE.
    Deliberate choice: pure vanilla HTML + CSS + JS so the page works fully
    offline (no CDN), which matters for a live presentation. All "heavy"
    effects (3D dice, winding path, confetti) are done with CSS transforms,
    SVG and small JS helpers — see assets/script.js and assets/style.css.
  -->

  <header class="topbar">
    <h1>🎓 Lucy's PhD Journey</h1>
    <p>Roll the dice and relive every moment of the PhD.</p>
  </header>

  <main class="game">
    <!-- The board: a winding 48-tile path rendered as SVG road + DOM tiles -->
    <div class="board-wrap" id="board-wrap">
      <div class="board" id="board">
        <svg id="path-svg" class="path-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="banners" class="banners"></div>
        <div id="tiles" class="tiles"></div>
        <div id="token" class="token">👩‍🎓</div>
      </div>
    </div>

    <!-- Side panel: dice, controls, legend -->
    <aside class="panel">
      <div class="dice-area">
        <div class="dice-scene">
          <div class="dice" id="dice"></div>
        </div>
        <button class="roll-btn" id="roll-btn">🎲 Roll the dice</button>
        <div class="status" id="status">Press "Roll the dice" to begin.</div>
        <div class="progress" title="Journey progress">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </aside>
  </main>

  <!-- Event / "breathe" modal -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-accent"></div>
      <div class="modal-flag" id="modal-flag"></div>
      <div class="modal-emoji" id="modal-emoji"></div>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-text" id="modal-text"></p>
      <div class="modal-effect hidden" id="modal-effect"></div>
      <button class="modal-btn" id="modal-btn">Continue</button>
    </div>
  </div>

  <!-- Congratulatory finale -->
  <div class="finale hidden" id="finale">
    <div class="confetti" id="confetti"></div>
    <div class="finale-card">
      <div class="finale-emoji">🎓🎉</div>
      <h2>Congratulations, Lucy!</h2>
      <p>
        Thesis defended! She is flying off to a well-earned vacation in Izmir —
        cocktails and beach. 🍹🏖️
      </p>
      <button class="modal-btn" id="restart-btn">Play again</button>
    </div>
  </div>

  <script src="assets/script.js"></script>
</body>
</html>
